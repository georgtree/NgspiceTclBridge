[project]
dialect = tcl90

[optimiser]
enabled = true

[diagnostics]
enabled = true
disabled = W210, W108, W212, W300, W111
exclude =
    docs/**
    *.ruff
    *.tcl
    *.test

[shimmer]
enabled = true

[features]
inlayHints = false
inlayTypeHints = false
inlayParameterHints = false

[formatting]
indent_size = 4